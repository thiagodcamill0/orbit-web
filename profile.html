<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>orbit — Perfil</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/profile.css" />
</head>
<body>
<div class="app">

  <!-- ─── Sidebar ──────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span class="sidebar-brand-name">Orbit</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-label">Principal</div>
        <a class="nav-item" href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span class="nav-label">Home</span>
        </a>
        <a class="nav-item" href="agents.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            <circle cx="19" cy="9" r="2.5"/>
            <path d="M21.5 14c1.5.5 2.5 1.7 2.5 3"/>
          </svg>
          <span class="nav-label">Agentes</span>
        </a>
        <a class="nav-item" href="analytics.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
          <span class="nav-label">Analytics</span>
        </a>
        <a class="nav-item" href="security.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span class="nav-label">Security</span>
        </a>
        <a class="nav-item" href="results.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="3" y1="15" x2="21" y2="15"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
          <span class="nav-label">Results</span>
        </a>
        <a class="nav-item" href="logs.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          <span class="nav-label">Logs</span>
        </a>
      </div>
      <div class="nav-section">
        <div class="nav-section-label">Sistema</div>
        <a class="nav-item" href="integrations.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <span class="nav-label">Integrações</span>
        </a>
        <a class="nav-item" href="settings.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span class="nav-label">Configurações</span>
        </a>
        <a class="nav-item" href="billing.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="1" y="4" width="22" height="16" rx="2"/>
            <line x1="1" y1="10" x2="23" y2="10"/>
          </svg>
          <span class="nav-label">Billing</span>
        </a>
      </div>
    </nav>

    <button class="sidebar-toggle-btn" aria-label="Toggle sidebar">
      <svg class="sidebar-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>

    <div class="sidebar-footer">
      <a class="sidebar-user active" href="profile.html">
        <div class="user-avatar" id="sidebarAvatar"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.5"/><path d="M3 20.5c0-4.14 4.03-7.5 9-7.5s9 3.36 9 7.5"/></svg></div>
        <div class="user-info">
          <div class="user-name" id="sidebarName">Usuário</div>
          <div class="user-role">Administrador</div>
        </div>
        <svg class="user-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
        </svg>
      </a>
    </div>
  </aside>

  <!-- ─── Main ──────────────────────────────────── -->
  <div class="main">
    <div class="content">
      <div class="profile-wrap">

        <div class="page-header">
          <div class="page-title">Perfil</div>
          <div class="page-desc">Gerencie suas informações pessoais e segurança</div>
        </div>

        <!-- Avatar -->
        <div class="profile-avatar-section">
          <div class="avatar-wrap">
            <div class="avatar-circle" id="avatarCircle"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.5"/><path d="M3 20.5c0-4.14 4.03-7.5 9-7.5s9 3.36 9 7.5"/></svg></div>
            <div class="avatar-overlay" id="avatarOverlay">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
            </div>
            <input type="file" id="avatarInput" accept="image/*" hidden />
          </div>
          <div class="avatar-meta">
            <div class="avatar-name" id="avatarName">Usuário</div>
            <div class="avatar-role">Administrador</div>
          </div>
          <button class="avatar-photo-btn" id="avatarBtn">Trocar foto</button>
        </div>

        <!-- Dados pessoais -->
        <div class="profile-card">
          <div class="profile-card-header">
            <span class="profile-card-title">Dados pessoais</span>
          </div>
          <div class="profile-card-body">

            <!-- Nome -->
            <div class="field-row" id="nameRow">
              <span class="field-label">Nome</span>
              <span class="field-value" id="nameDisplay">Usuário</span>
              <button class="field-action-btn" id="editNameBtn">Editar</button>
            </div>
            <div class="field-edit-wrap" id="nameEditWrap">
              <input class="form-input" type="text" id="nameInput" value="Usuário" placeholder="Seu nome" />
              <div class="field-edit-actions">
                <button class="btn-sm btn-sm-ghost" id="cancelNameBtn">Cancelar</button>
                <button class="btn-sm btn-sm-accent" id="saveNameBtn">Salvar</button>
              </div>
            </div>

            <!-- Email -->
            <div class="field-row">
              <span class="field-label">Email</span>
              <span class="field-value muted">usuario@email.com</span>
            </div>

          </div>
        </div>

        <!-- Segurança -->
        <div class="profile-card">
          <div class="profile-card-header">
            <span class="profile-card-title">Segurança</span>
          </div>
          <div class="profile-card-body">

            <div class="password-toggle" id="passwordToggle">
              <span class="password-toggle-label">Alterar senha</span>
              <svg class="password-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>

            <div class="password-form" id="passwordForm">
              <div class="form-group" style="padding-top:14px">
                <label class="form-label">Senha atual</label>
                <input class="form-input" type="password" id="currentPassword" placeholder="••••••••" />
              </div>
              <div class="form-group">
                <label class="form-label">Nova senha</label>
                <input class="form-input" type="password" id="newPassword" placeholder="••••••••" />
              </div>
              <div class="form-group">
                <label class="form-label">Confirmar nova senha</label>
                <input class="form-input" type="password" id="confirmPassword" placeholder="••••••••" />
              </div>
              <div class="password-form-actions">
                <button class="btn-sm btn-sm-ghost" id="cancelPasswordBtn">Cancelar</button>
                <button class="btn-sm btn-sm-accent" id="savePasswordBtn">Salvar senha</button>
              </div>
            </div>

          </div>
        </div>

        <!-- Logout -->
        <div class="logout-section">
          <button class="logout-btn" id="logoutBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Sair da conta
          </button>
        </div>

      </div>
    </div>
  </div>

</div>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/sidebar.js"></script>
<script type="module" src="js/profile.js"></script>
</body>
</html>
