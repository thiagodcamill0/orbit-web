<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit — Agentes</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/canvas.css" />
  <link rel="stylesheet" href="css/panel.css" />
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span class="sidebar-brand-name">Orbit</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-label">Principal</div>
        <a class="nav-item" href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span class="nav-label">Home</span>
        </a>
        <a class="nav-item active" href="agents.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            <circle cx="19" cy="9" r="2.5"/>
            <path d="M21.5 14c1.5.5 2.5 1.7 2.5 3"/>
          </svg>
          <span class="nav-label">Agentes</span>
        </a>
        <a class="nav-item" href="analytics.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
          <span class="nav-label">Analytics</span>
        </a>
        <a class="nav-item" href="security.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span class="nav-label">Security</span>
        </a>
        <a class="nav-item" href="results.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="3" y1="15" x2="21" y2="15"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
          <span class="nav-label">Results</span>
        </a>
        <a class="nav-item" href="logs.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          <span class="nav-label">Logs</span>
        </a>
      </div>
      <div class="nav-section">
        <div class="nav-section-label">Sistema</div>
        <a class="nav-item" href="integrations.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <span class="nav-label">Integrações</span>
        </a>
        <a class="nav-item" href="settings.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span class="nav-label">Configurações</span>
        </a>
        <a class="nav-item" href="billing.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="1" y="4" width="22" height="16" rx="2"/>
            <line x1="1" y1="10" x2="23" y2="10"/>
          </svg>
          <span class="nav-label">Billing</span>
        </a>
      </div>
    </nav>

    <button class="sidebar-toggle-btn" aria-label="Toggle sidebar">
      <svg class="sidebar-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <div class="sidebar-footer">
      <a class="sidebar-user" href="profile.html">
        <div class="user-avatar"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.5"/><path d="M3 20.5c0-4.14 4.03-7.5 9-7.5s9 3.36 9 7.5"/></svg></div>
        <div class="user-info">
          <div class="user-name">Usuário</div>
          <div class="user-role">Administrador</div>
        </div>
        <svg class="user-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
        </svg>
      </a>
    </div>
  </aside>

  <div class="main">
    <div class="canvas-viewport" id="canvasViewport">

      <div class="canvas-world" id="canvasWorld">

        <!-- Agent node -->
        <div class="agent-node" id="agentNode" style="left: 1956px; top: 1920px;">

          <!-- Quick actions (edit mode) -->
          <div class="agent-actions">
            <button class="agent-action" data-action="name" title="Editar nome">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/>
              </svg>
            </button>
            <button class="agent-action" data-action="prompt" title="Editar prompt">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                <line x1="9" y1="10" x2="15" y2="10"/>
                <line x1="9" y1="14" x2="13" y2="14"/>
              </svg>
            </button>
            <button class="agent-action" data-action="delete" title="Excluir agente">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                <path d="M10 11v6M14 11v6"/>
                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
              </svg>
            </button>
            <button class="agent-action" data-action="subagent" title="Criar subagente">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="4" r="2"/><circle cx="4" cy="20" r="2"/><circle cx="20" cy="20" r="2"/>
                <path d="M12 6v5M12 11l-6 7M12 11l6 7"/>
              </svg>
            </button>
          </div>

          <img class="agent-node-pokemon" id="pokemonSprite" src="" alt="" draggable="false" />
          <div class="agent-node-shadow"></div>
          <div class="agent-node-label" id="agentNodeLabel">agente</div>
        </div>

      </div>

      <!-- New board button -->
      <button class="canvas-board-btn" id="newBoardBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
        </svg>
        Novo quadro
      </button>

      <!-- Color picker popover -->
      <div class="board-color-popover" id="boardColorPopover">
        <div class="board-color-swatch active" data-color="#1e3a5f" style="background:#1e3a5f" title="Azul"></div>
        <div class="board-color-swatch" data-color="#3b2469" style="background:#3b2469" title="Roxo"></div>
        <div class="board-color-swatch" data-color="#1a4230" style="background:#1a4230" title="Verde"></div>
        <div class="board-color-swatch" data-color="#5c3010" style="background:#5c3010" title="Laranja"></div>
        <div class="board-color-swatch" data-color="#561830" style="background:#561830" title="Rosa"></div>
        <div class="board-color-swatch" data-color="#1e3040" style="background:#1e3040" title="Cinza azulado"></div>
        <div class="board-color-sep"></div>
        <div class="board-color-custom" title="Cor personalizada">
          <input type="color" id="boardColorCustom" value="#2a3a52" />
        </div>
      </div>

      <!-- New agent button -->
      <button class="canvas-new-btn" id="newAgentBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Novo agente
      </button>

      <!-- Zoom controls -->
      <div class="canvas-controls">
        <button class="canvas-ctrl-btn" id="zoomIn" title="Aproximar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <span class="canvas-zoom-label" id="zoomLabel">100%</span>
        <button class="canvas-ctrl-btn" id="zoomOut" title="Afastar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button class="canvas-ctrl-btn" id="zoomReset" title="Resetar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
      </div>

    </div>

    <!-- ─── Agent Panel ───────────────────────── -->
    <div class="agent-panel" id="agentPanel">

      <div class="agent-panel-header">
        <div class="agent-panel-identity">
          <img class="panel-pokemon-mini" id="panelPokemonMini" src="" alt="" />
          <span class="agent-panel-name" id="panelAgentName">agente</span>
        </div>
        <button class="agent-panel-close" id="closePanelBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="agent-panel-body">

        <!-- Identidade -->
        <div class="panel-section">
          <div class="panel-section-label">Identidade</div>

          <div class="panel-field">
            <label class="panel-label">Nome</label>
            <input class="panel-input" type="text" id="fieldName" value="agente" />
          </div>

          <div class="panel-field">
            <label class="panel-label">Fonte de aparência</label>
            <select class="panel-select" id="fieldApiSource">
              <option value="gif">Padrão</option>
              <option value="pokemon">Pokémon</option>
            </select>
          </div>

          <div class="panel-field">
            <label class="panel-label">Cor</label>
            <div class="filter-swatches" id="filterSwatches">
              <div class="filter-swatch active" data-filter="none"   style="background:#64748b" title="Padrão"></div>
              <div class="filter-swatch"        data-filter="red"    style="background:#f87171" title="Vermelho"></div>
              <div class="filter-swatch"        data-filter="orange" style="background:#fb923c" title="Laranja"></div>
              <div class="filter-swatch"        data-filter="yellow" style="background:#fbbf24" title="Amarelo"></div>
              <div class="filter-swatch"        data-filter="green"  style="background:#4ade80" title="Verde"></div>
              <div class="filter-swatch"        data-filter="cyan"   style="background:#22d3ee" title="Ciano"></div>
              <div class="filter-swatch"        data-filter="blue"   style="background:#60a5fa" title="Azul"></div>
              <div class="filter-swatch"        data-filter="purple" style="background:#a78bfa" title="Roxo"></div>
              <div class="filter-swatch"        data-filter="pink"   style="background:#f472b6" title="Rosa"></div>
            </div>
          </div>

          <div class="panel-field">
            <label class="panel-label" id="fieldSpriteIdLabel">ID do personagem (1–999)</label>
            <div class="pokemon-picker-row">
              <input class="panel-input pokemon-id-input" type="number" id="fieldPokemonId"
                     min="1" max="999" placeholder="1–999" />
              <img class="pokemon-picker-preview" id="pokemonPickerPreview" src="" alt="" />
            </div>
          </div>
        </div>

        <!-- Modelo -->
        <div class="panel-section">
          <div class="panel-section-label">Modelo</div>
          <div class="panel-field">
            <label class="panel-label">Provedor</label>
            <select class="panel-select" id="fieldModel">
              <option value="openai/gpt-4o">GPT-4o</option>
              <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
              <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
              <option value="anthropic/claude-3-haiku">Claude 3 Haiku</option>
              <option value="google/gemini-pro-1.5">Gemini Pro 1.5</option>
              <option value="meta-llama/llama-3.1-70b-instruct">Llama 3.1 70B</option>
              <option value="deepseek/deepseek-r1">DeepSeek R1</option>
            </select>
          </div>
        </div>

        <!-- Prompt do sistema -->
        <div class="panel-section">
          <div class="panel-section-label">Prompt do Sistema</div>
          <div class="panel-field">
            <textarea class="panel-textarea" id="fieldPrompt"
                      placeholder="Descreva o comportamento do agente..." rows="5"></textarea>
          </div>
        </div>

        <!-- Status -->
        <div class="panel-section">
          <div class="panel-section-label">Status</div>
          <div class="status-group">
            <button class="status-chip active" data-status="active">
              <span class="status-dot"></span>Ativo
            </button>
            <button class="status-chip" data-status="idle">
              <span class="status-dot"></span>Em espera
            </button>
            <button class="status-chip" data-status="inactive">
              <span class="status-dot"></span>Inativo
            </button>
          </div>
        </div>


      </div>

      <div class="agent-panel-footer">
        <button class="panel-btn-ghost" id="deleteAgentBtn">Excluir</button>
        <button class="panel-btn-accent" id="saveAgentBtn">Salvar</button>
      </div>

    </div>

  </div>

</div>
<!-- Create agent modal -->
<div class="create-overlay" id="createOverlay">
  <div class="create-modal">
    <div class="create-modal-hd">
      <span class="create-modal-title">Novo agente</span>
      <button class="create-modal-close" id="createModalClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="create-modal-body">
      <div class="create-field">
        <label class="create-label">Nome</label>
        <input class="create-input" type="text" id="createName" placeholder="Nome do agente" />
      </div>
      <div class="create-field">
        <label class="create-label">Modelo</label>
        <select class="create-select" id="createModel">
          <option value="openai/gpt-4o">GPT-4o</option>
          <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
          <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
          <option value="anthropic/claude-3-haiku">Claude 3 Haiku</option>
          <option value="google/gemini-pro-1.5">Gemini Pro 1.5</option>
          <option value="meta-llama/llama-3.1-70b-instruct">Llama 3.1 70B</option>
          <option value="deepseek/deepseek-r1">DeepSeek R1</option>
        </select>
      </div>
    </div>
    <div class="create-modal-ft">
      <button class="btn-sm btn-sm-ghost" id="createCancel">Cancelar</button>
      <button class="btn-sm btn-sm-accent" id="createConfirm">Criar agente</button>
    </div>
  </div>
</div>

<script src="js/boards.js"></script>
<script type="module" src="js/agents.js"></script>
<script src="js/sidebar.js"></script>
</body>
</html>
