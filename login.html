<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit — Login</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="login-body">

  <div class="login-layout">

    <!-- ─── Lado esquerdo: formulário ─────────────── -->
    <div class="login-form-side">

      <div class="login-form-wrap">

        <div class="login-brand">
          <span class="login-brand-name">Orbit</span>
          <p class="login-subtitle">Entre na sua conta para continuar</p>
        </div>

        <form class="login-form" id="loginForm" novalidate>

          <div class="field-group" id="fieldEmail">
            <div class="field-input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
              <input
                class="field-input"
                type="email"
                id="email"
                name="email"
                placeholder="seu@email.com"
                autocomplete="email"
                autofocus
              />
            </div>
            <span class="field-error" id="emailError"></span>
          </div>

          <div class="field-group" id="fieldPassword">
            <div class="field-input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input
                class="field-input"
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
              />
              <button type="button" class="field-toggle-pw" id="togglePw" aria-label="Mostrar senha" tabindex="-1">
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <span class="field-error" id="passwordError"></span>
          </div>

          <div class="login-options">
            <label class="remember-label">
              <input type="checkbox" id="rememberMe" class="remember-check" />
              <span class="remember-custom"></span>
              <span class="remember-text">Lembrar acesso</span>
            </label>
            <a href="#" class="forgot-link" id="forgotLink">Esqueci minha senha</a>
          </div>

          <div class="login-error-banner" id="loginErrorBanner" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="loginErrorText">Credenciais inválidas. Tente novamente.</span>
          </div>

          <button type="submit" class="login-btn" id="loginBtn">
            <span class="login-btn-text">Entrar</span>
            <span class="login-btn-spinner" id="loginSpinner" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              </svg>
            </span>
          </button>

        </form>

        <p class="login-signup">
          Não tem uma conta?
          <a href="#" class="signup-link">Solicitar acesso</a>
        </p>

      </div>

    </div>

    <!-- ─── Lado direito: visual ───────────────────── -->
    <div class="login-visual-side">
      <div class="login-visual-inner">
        <img
          src="assets/images/login.gif"
          alt="Orbit visual"
          class="login-gif"
          draggable="false"
        />
      </div>
    </div>

  </div>

  <script src="js/login.js"></script>
</body>
</html>
